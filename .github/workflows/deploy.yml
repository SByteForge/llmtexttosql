name: Deploy

# Fires on every push to dev/qa/prod. The `environment:` on the deploy job
# is set to the branch name itself, so pushing to `qa` automatically pulls
# secrets scoped to the "qa" GitHub Environment (Settings > Environments) -
# each branch only ever sees its own SSH_HOST/SSH_USER/SSH_KEY/DEPLOY_PATH.
# Add required reviewers on the "prod" Environment to force manual approval
# before anything reaches production - see docs/DEPLOYMENT.md.
on:
  push:
    branches: [dev, qa, prod]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, push, and deploy (${{ github.ref_name }})
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GITHUB_REPOSITORY,GITHUB_ACTOR,GITHUB_TOKEN,GITHUB_REF_NAME,SSH_APP_PORT,SSH_DEPLOY_PATH,SSH_OLLAMA_MODEL
          script: |
            set -euo pipefail
            cd "${SSH_DEPLOY_PATH}"
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            export IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
            export IMAGE_TAG="${GITHUB_REF_NAME}"
            export APP_PORT="${SSH_APP_PORT}"
            docker compose pull app
            docker compose up -d
            docker compose exec -T ollama ollama pull "${SSH_OLLAMA_MODEL:-gemma4:latest}" || true
            docker image prune -f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          SSH_APP_PORT: ${{ secrets.APP_PORT }}
          SSH_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
