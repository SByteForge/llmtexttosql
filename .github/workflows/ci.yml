name: CI

# workflow_call lets deploy.yml re-run this exact set of checks as a
# prerequisite job, so "pass CI" means the same thing whether triggered by
# a PR, a direct push, or a deploy.
on:
  pull_request:
    branches: [dev, qa, prod]
  push:
    branches: [dev, qa, prod]
  workflow_call:

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Compile check
        run: python -m py_compile src/*.py

      - name: Run tests
        run: pytest -v

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t llmtexttosql-app:ci .
