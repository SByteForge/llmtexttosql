services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: ${IMAGE:-llmtexttosql-app}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DB_TYPE: ${DB_TYPE:-sqlite}
      SQLITE_PATH: /app/data/demo.db
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-}
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      - app_data:/app/data

volumes:
  ollama_data:
  app_data:
